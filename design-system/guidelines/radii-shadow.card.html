<!-- @dsCard group="Brand" viewport="700x160" name="Radii & elevation" subtitle="3–8px radii, three shadow steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:16px;align-items:center">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">xs 3px</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm 4px</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md 6px</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">lg 8px</div></div>
<div style="width:1px;height:56px;background:var(--border-subtle)"></div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:48px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">lg</div></div>
</div></body></html>
