<!-- @dsCard group="Brand" viewport="700x160" name="Claim highlight" subtitle="The core motif: inline span marking with a 2px underline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Highlight</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<p style="font-size:var(--text-subhead);line-height:var(--leading-loose);max-width:var(--measure-prose)">The 2024 report was <mark style="background:var(--verified-bg);border-bottom:var(--border-width-accent) solid var(--verified-line);padding:1px 2px">published in March</mark> and states that <mark style="background:var(--unsupported-bg);border-bottom:var(--border-width-accent) solid var(--unsupported-line);padding:1px 2px">revenue grew 41% year over year</mark>, while the filing puts the figure at <mark style="background:var(--contradicted-bg);border-bottom:var(--border-width-accent) solid var(--contradicted-line);padding:1px 2px">12%</mark>.</p>
<div class="lbl" style="margin-top:14px">tinted background + 2px underline · never a border-left accent</div></body></html>
