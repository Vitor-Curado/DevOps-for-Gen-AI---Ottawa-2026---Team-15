<!-- @dsCard group="Type" viewport="700x170" name="Body & heading" subtitle="15px base, 1.6 leading, 64ch measure" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Body</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:grid;gap:8px;max-width:var(--measure-prose)">
<div style="font-size:var(--text-heading);font-weight:var(--weight-semibold);color:var(--text-strong)">Heading / 20px / 600</div>
<p style="font-size:var(--text-base);line-height:var(--leading-body);text-wrap:pretty">Body copy runs at 15px with 1.6 leading. Explanations stay plain and factual: what the detector found, which span it came from, and what the reviewer can do about it.</p>
<p style="font-size:var(--text-sm);color:var(--text-muted)">Small / 13px / muted — metadata, timestamps, source citations.</p>
</div></body></html>
