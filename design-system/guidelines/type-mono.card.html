<!-- @dsCard group="Type" viewport="700x150" name="Mono & labels" subtitle="IBM Plex Mono for labels, scores, CLI output" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mono</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:grid;gap:10px">
<div class="lbl">eyebrow label / mono 11 / +0.11em</div>
<div style="font-family:var(--font-mono);font-size:var(--text-heading);color:var(--text-strong)">0.42 <span style="color:var(--text-muted);font-size:var(--text-sm)">support score</span></div>
<pre style="font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface-terminal);color:var(--ink-100);padding:10px 12px;border-radius:var(--radius-sm);margin:0">$ detect run report.md --strict
2 unsupported · 1 contradicted · 4 verified</pre>
</div></body></html>
