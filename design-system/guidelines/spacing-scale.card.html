<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base, 4→80" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">1</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">2</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">3</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">4</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">5</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">6</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">8</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">10</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">12</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-16);height:var(--space-16);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">16</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-20);height:var(--space-20);background:var(--ink-800);border-radius:2px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">20</div></div>
</div><div class="lbl" style="margin-top:14px">--space-1 … --space-20</div></body></html>
