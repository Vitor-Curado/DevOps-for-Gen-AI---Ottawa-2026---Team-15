<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="Text, surface and border roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style><style>
table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:var(--text-xs)}
td{padding:5px 8px;border-bottom:1px solid var(--border-subtle)}
.chip{width:22px;height:14px;border-radius:2px;border:1px solid var(--border-subtle);display:inline-block}
.c2{color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px"><table>
<tr><td><span class="chip" style="background:var(--text-strong)"></span></td><td>--text-strong</td><td class="c2">ink-900</td></tr>
<tr><td><span class="chip" style="background:var(--text-body)"></span></td><td>--text-body</td><td class="c2">ink-800</td></tr>
<tr><td><span class="chip" style="background:var(--text-muted)"></span></td><td>--text-muted</td><td class="c2">ink-500</td></tr>
<tr><td><span class="chip" style="background:var(--text-link)"></span></td><td>--text-link</td><td class="c2">indigo-600</td></tr>
</table><table>
<tr><td><span class="chip" style="background:var(--surface-page)"></span></td><td>--surface-page</td><td class="c2">paper</td></tr>
<tr><td><span class="chip" style="background:var(--surface-card)"></span></td><td>--surface-card</td><td class="c2">white</td></tr>
<tr><td><span class="chip" style="background:var(--surface-sunken)"></span></td><td>--surface-sunken</td><td class="c2">ink-50</td></tr>
<tr><td><span class="chip" style="background:var(--border-subtle)"></span></td><td>--border-subtle</td><td class="c2">ink-200</td></tr>
</table></div></body></html>
