<!-- @dsCard group="Colors" viewport="700x150" name="Accents" subtitle="Amber, green, red, indigo — one ramp each" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Accents</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row">
<div class="sw" style="background:var(--amber-500);color:var(--ink-900)"><b>amber-500</b><span>#F5A524</span></div><div class="sw" style="background:var(--amber-50);color:var(--amber-600)"><b>amber-50</b><span>#FEF4E3</span></div><div class="sw" style="background:var(--green-600);color:#fff"><b>green-600</b><span>#0E7C66</span></div><div class="sw" style="background:var(--green-50);color:var(--green-700)"><b>green-50</b><span>#E6F4F0</span></div><div class="sw" style="background:var(--red-600);color:#fff"><b>red-600</b><span>#B42318</span></div><div class="sw" style="background:var(--red-50);color:var(--red-700)"><b>red-50</b><span>#FDECEB</span></div><div class="sw" style="background:var(--indigo-600);color:#fff"><b>indigo-600</b><span>#3538CD</span></div><div class="sw" style="background:var(--indigo-50);color:var(--indigo-600)"><b>indigo-50</b><span>#EEF0FD</span></div>
</div></body></html>
