<!-- @dsCard group="Colors" viewport="700x160" name="Verdict states" subtitle="The four states every claim can be in" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Verdicts</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style><style>
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.v{border:1px solid;border-left-width:0;border-radius:var(--radius-sm);padding:10px 12px;display:grid;gap:6px}
.v .n{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.v .t{font-size:var(--text-sm);color:var(--text-muted)}
.bar{height:3px;border-radius:2px}</style></head><body><div class="grid">
<div class="v" style="background:var(--verified-bg);border-color:var(--verified-line)"><div class="bar" style="background:var(--verified-line)"></div><div class="n" style="color:var(--verified-fg)">Verified</div><div class="t">Traced to a source span</div></div>
<div class="v" style="background:var(--unsupported-bg);border-color:var(--unsupported-line)"><div class="bar" style="background:var(--unsupported-line)"></div><div class="n" style="color:var(--unsupported-fg)">Unsupported</div><div class="t">No grounding found</div></div>
<div class="v" style="background:var(--contradicted-bg);border-color:var(--contradicted-line)"><div class="bar" style="background:var(--contradicted-line)"></div><div class="n" style="color:var(--contradicted-fg)">Contradicted</div><div class="t">Conflicts with source</div></div>
<div class="v" style="background:var(--unchecked-bg);border-color:var(--unchecked-line)"><div class="bar" style="background:var(--unchecked-line)"></div><div class="n" style="color:var(--unchecked-fg)">Unchecked</div><div class="t">Not yet evaluated</div></div>
</div></body></html>
