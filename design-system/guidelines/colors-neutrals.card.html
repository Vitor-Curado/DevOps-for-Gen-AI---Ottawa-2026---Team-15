<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Warm-cool ink ramp over off-white paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row">
<div class="sw" style="background:var(--ink-900);color:#fff"><b>ink-900</b><span>#101828</span></div><div class="sw" style="background:var(--ink-700);color:#fff"><b>ink-700</b><span>#344054</span></div><div class="sw" style="background:var(--ink-500);color:#fff"><b>ink-500</b><span>#667085</span></div><div class="sw" style="background:var(--ink-300);color:var(--ink-900)"><b>ink-300</b><span>#C8C6C0</span></div><div class="sw" style="background:var(--ink-200);color:var(--ink-900)"><b>ink-200</b><span>#E4E2DD</span></div><div class="sw" style="background:var(--ink-50);color:var(--ink-900)"><b>ink-50</b><span>#F7F5F1</span></div><div class="sw" style="background:var(--paper);color:var(--ink-900)"><b>paper</b><span>#FBFAF8</span></div>
</div></body></html>
