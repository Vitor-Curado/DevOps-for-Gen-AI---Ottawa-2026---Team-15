<!-- @dsCard group="Type" viewport="700x150" name="Display & title" subtitle="IBM Plex Sans, tight tracking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Display</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);padding:20px}
.row{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:96px;font-family:var(--font-mono);font-size:10px;line-height:1.35}
.sw b{font-weight:500;display:block}.sw span{opacity:.7}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:grid;gap:10px">
<div style="font-size:var(--text-display);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-tight);line-height:var(--leading-tight);color:var(--text-strong)">Every claim, traced</div>
<div style="font-size:var(--text-title);font-weight:var(--weight-medium);letter-spacing:var(--tracking-tight);color:var(--text-strong)">Title / 28px / 500</div>
<div class="lbl">display 44 · title 28</div>
</div></body></html>
